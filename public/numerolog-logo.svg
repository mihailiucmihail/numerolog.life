<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" role="img" aria-labelledby="title desc">
  <title id="title">NUMEROLOG</title>
  <desc id="desc">Logo-ul NUMEROLOG cu simbol diamant auriu și text serif</desc>
  <defs>
    <linearGradient id="symbolGold" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8A84B"/>
      <stop offset="45%" stop-color="#F2D472"/>
      <stop offset="100%" stop-color="#A8782A"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8782A"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="55%" stop-color="#F2D472"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8782A"/>
    </linearGradient>
    <radialGradient id="symbolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2D472" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#C8A84B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(2 18)" filter="url(#glow)">
    <path d="M18 2 34 18 18 34 2 18Z" stroke="url(#symbolGold)" stroke-width="1.1" fill="url(#symbolGlow)"/>
    <path d="M18 9 27 18 18 27 9 18Z" stroke="url(#symbolGold)" stroke-width=".7" fill="none" stroke-opacity=".7"/>
    <path d="M18 13v10M13 18h10" stroke="url(#symbolGold)" stroke-width=".5" stroke-opacity=".5"/>
    <circle cx="18" cy="18" r="2.2" fill="url(#symbolGold)"/>
    <circle cx="18" cy="18" r="1" fill="#FFF5C0" fill-opacity=".9"/>
  </g>
  <path d="M62 24v24" stroke="#D4AF37" stroke-opacity=".35"/>
  <text x="80" y="45" fill="url(#textGold)" font-family="Cormorant Garamond, Georgia, serif" font-size="25" font-weight="700" letter-spacing="7">NUMEROLOG</text>
  <path d="M80 53h300" stroke="#D4AF37" stroke-opacity=".6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">NUMEROLOG.life</title>
  <desc id="desc">Logo Numerolog.life animat, cu fundal transparent</desc>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37"/>
      <stop offset=".45" stop-color="#fff1a8"><animate attributeName="offset" values="-.2;.55;1.2" dur="3.6s" repeatCount="indefinite"/></stop>
      <stop offset=".6" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <g transform="translate(360 125)" filter="url(#glow)">
    <g fill="none" stroke="#d4af37" stroke-width="5">
      <rect x="-54" y="-54" width="108" height="108" rx="8" transform="rotate(45)"/>
      <rect x="-25" y="-25" width="50" height="50" rx="4" transform="rotate(45)" stroke="#f2d472" stroke-width="4"/>
    </g>
    <circle r="7" fill="#f2d472"><animate attributeName="r" values="7;11;7" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.65;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
  </g>
  <text x="360" y="325" text-anchor="middle" fill="url(#shine)" font-family="Georgia, serif" font-size="64" font-weight="500" letter-spacing="13">NUMEROLOG<tspan letter-spacing="1">.life</tspan></text>
</svg>

<style>
    /* ==== Mod preview (raport gratuit, parțial blurat) — activ doar cu ?preview=1 ==== */
    .cd-preview .hero,
    .cd-preview #inputFormCard,
    .cd-preview #pdfDownloadCard{display:none !important;}
    /* În timpul ecranului „Cristalul se formează” conţinutul iframe-ului este invizibil (raportul se calculează
       în fundal); când aplicaţia trimite `previewReveal`, apare cu un fade lin. */
    body.cd-forming > *{opacity:0 !important;transition:none !important;}
    body > *{transition:opacity .7s ease;}
    /* Blur PUTERNIC — folosit doar pe grafice (viitorul în bare/rânduri/linii). */
    .cd-lock{
      filter:blur(11px) saturate(.7);
      opacity:.5;
      user-select:none;-webkit-user-select:none;
      pointer-events:none;
    }
    .cd-lock *{pointer-events:none !important;}
    .cd-preview .cd-lock summary::after{content:"" !important;}
    .cd-preview details.cd-lock[open] .body{max-height:120px;overflow:hidden;}
    /* Card cu chenar dublu: primele 30 % lizibile; restul 70 % — blur care creşte TREPTAT (fără linie bruscă).
       PERFORMANŢĂ: FĂRĂ `backdrop-filter`. Pe 40+ carduri / ~60 000 px de raport, backdrop-filter se
       recompune la FIECARE cadru de derulare (măsurat: 34 ms/cadru vs 16 ms fără) şi pe iOS Safari epuizează
       memoria GPU → pagina e reîncărcată (utilizatorul „e trimis înapoi la formular”). În loc, JS aplică
       `filter: blur` direct pe elementele de sub linia de 30 % (rasterizat o singură dată, derulat ca imagine),
       cu intensitate crescătoare (.cd-blur-1 … .cd-blur-4), iar ::after adaugă doar o ceaţă de gradient. */
    .cd-report-part{position:relative;user-select:none;-webkit-user-select:none;}
    .cd-part{position:relative;user-select:none;-webkit-user-select:none;}
    .cd-part > *:not(.section-title):not(.cd-unlock){pointer-events:none;}
    /* Tranziție PROGRESIVĂ: text lizibil → blur ușor → blur mediu → blur puternic → zonă închisă. */
    .cd-preview .cd-blur-1{filter:blur(3px) saturate(.9);opacity:.72;}
    .cd-preview .cd-blur-2{filter:blur(5px) saturate(.85);opacity:.6;}
    .cd-preview .cd-blur-3{filter:blur(7px) saturate(.8);opacity:.5;}
    .cd-preview .cd-blur-4{filter:blur(9px) saturate(.75);opacity:.42;}
    /* SECURITATE: sub linia de 30 % textul premium NU există în DOM — este înlocuit cu schelete (contururi de
       paragrafe/grafice) de aceeași înălțime. Scoaterea blur-ului din DevTools arată doar aceste forme. */
    .cd-skel{display:flex !important;flex-direction:column;justify-content:flex-start;gap:9px;
      box-sizing:border-box;overflow:hidden;padding-top:4px;padding-bottom:4px;}
    .cd-skel i{display:block;flex:none;height:11px;border-radius:6px;
      background:linear-gradient(90deg,rgba(217,169,79,.22),rgba(241,230,207,.12) 70%,rgba(217,169,79,.16));}
    .cd-skel i.cd-skel-block{height:auto;flex:1 1 auto;min-height:38px;border-radius:12px;
      background:linear-gradient(180deg,rgba(217,169,79,.14),rgba(241,230,207,.06));border:1px solid rgba(217,169,79,.18);}
    .cd-skel i.cd-skel-head{height:15px;width:46% !important;background:linear-gradient(90deg,rgba(217,169,79,.34),rgba(217,169,79,.16));}
    /* Tab-urile graficelor (Карьера / Личная жизнь / …) rămân interactive şi în preview,
       deasupra straturilor de blur — utilizatorul poate comuta graficele înainte de plată. */
    .cd-preview .cd-part .chart-tabs,
    .cd-preview .cd-part .chart-tabs *{pointer-events:auto !important;}
    .cd-preview .cd-part .chart-tabs{position:relative;z-index:5;}
    /* Telefon: marginile minime, raportul cât mai lat. */
    @media (max-width:560px){
      body{padding:12px 4px 48px !important;}
      .card{padding:14px 10px !important;margin-bottom:12px !important;}
      .cd-unlock-text{font-size:12.5px;}
    }
    /* Ceaţă de gradient (fără filtre — cost zero la derulare): începe la 30 % şi se îngroaşă lent până jos. */
    .cd-report-part::after{
      content:"";position:absolute;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
      top:var(--cd-cut,30%);
      background:linear-gradient(180deg, rgba(22,16,34,0) 0%, rgba(22,16,34,.08) 30%, rgba(22,16,34,.18) 65%, rgba(22,16,34,.26) 100%);
    }
    /* CTA pe zona blurată (în locul badge-ului din colţ): text + buton către plată. */
    .cd-unlock{
      position:absolute;left:0;right:0;z-index:4;
      top:calc(var(--cd-cut,30%) + (100% - var(--cd-cut,30%)) / 2);
      transform:translateY(-50%);
      display:flex;flex-direction:column;align-items:center;gap:10px;
      padding:0 16px;text-align:center;pointer-events:none;
    }
    .cd-unlock-text{
      font:500 13px/1.5 var(--sans, Inter, sans-serif);letter-spacing:.02em;
      color:#f1e6cf;text-shadow:0 1px 14px rgba(22,16,34,.95), 0 0 2px rgba(22,16,34,.9);
      max-width:360px;
    }
    .cd-unlock-btn{
      pointer-events:auto;cursor:pointer;
      display:inline-flex;align-items:center;gap:8px;
      font:600 11px/1 var(--sans, Inter, sans-serif);letter-spacing:.16em;text-transform:uppercase;
      color:#1a1220;background:linear-gradient(180deg,var(--brass-bright,#d9a94f),var(--brass,#b8863b));
      border:0;border-radius:2px;padding:12px 18px;
      box-shadow:0 8px 28px rgba(217,169,79,.28);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .cd-unlock-btn:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(217,169,79,.4);}
    .cd-unlock-btn::after{content:"→";font-size:13px;}
    /* Carduri scunde: doar butonul, ancorat în partea de jos a zonei blurate (nu peste textul vizibil). */
    .cd-unlock.cd-unlock-compact .cd-unlock-text{display:none;}
    .cd-unlock.cd-unlock-compact{top:auto;bottom:14px;transform:none;}
    .cd-preview .card{position:relative;}
    .cd-future-mask{
      position:absolute;top:0;bottom:0;right:0;z-index:2;pointer-events:none;
      /* Fundal COMPLET opac: pe telefon, orice transparență lăsa să se ghicească direcția liniilor. */
      background:#161022;
      border-left:1px dashed rgba(217,169,79,.85);
      /* Tranziție scurtă spre stânga, ca marginea să nu pară un „ștraif” tăiat; tot opac. */
      box-shadow:-14px 0 14px -4px rgba(22,16,34,.85);
    }
    /* Orice element SVG marcat „viitor” dispare de tot — nu doar blur (blur-ul păstrează forma curbei). */
    .cd-preview svg .cd-lock{opacity:0 !important;filter:none !important;}
    .cd-future-mask::after{
      content:"будущее — в полном разборе";
      position:absolute;top:10px;left:10px;right:10px;
      font:600 9.5px/1.3 var(--sans, Inter, sans-serif);letter-spacing:.14em;text-transform:uppercase;
      color:var(--brass-bright,#d9a94f);
    }
    .cd-preview .mandala-future-line{opacity:0 !important;}
    .cd-preview .chart-tooltip{display:none !important;}
</style>
<script>
    // ==== Preview blocat: raportul real; fiecare card 30 % vizibil / 70 % blur gradual moderat, grafice: viitor blurat puternic ====
    function __cdAfterNow(items, isNow){
      // Toate elementele DUPĂ cel „curent” (sau după ultimul „trecut”) devin blurate = viitor.
      let ni = -1;
      items.forEach(function(el, i){ if(isNow(el)) ni = i; });
      if(ni < 0) return;
      items.forEach(function(el, i){ if(i > ni){ el.classList.add('cd-lock'); if(el instanceof SVGElement) el.remove(); } });
    }
    function __cdMaskFuture(stage){
      if(!stage) return;
      const svg = stage.querySelector('svg');
      if(!svg) return;
      let mask = stage.querySelector(':scope > .cd-future-mask');
      const now = svg.querySelector('#nowLine, .now-line');
      const vb = (svg.getAttribute('viewBox') || '0 0 640 320').split(/\s+/).map(Number);
      const width = vb[2] || 640;
      if(!now){
        // Fără marker „acum” (vârstă în afara graficului): blurăm tot graficul.
        if(mask) mask.remove();
        svg.classList.add('cd-lock');
        return;
      }
      svg.classList.remove('cd-lock');
      const x = parseFloat(now.getAttribute('x1') || '0');
      const pct = Math.max(8, Math.min(96, (x / width) * 100));
      // Eticheta „Возраст N” rămâne complet vizibilă: o aliniem la STÂNGA liniei „acum”.
      const lbg = svg.querySelector('#nowLabelBg'), ltx = svg.querySelector('#nowLabelText');
      if(lbg && ltx){
        const lw = parseFloat(lbg.getAttribute('width') || '74');
        const nx = Math.max(4, x - lw - 6);
        lbg.setAttribute('x', nx.toFixed(1));
        ltx.setAttribute('x', (nx + lw / 2).toFixed(1));
      }
      if(!mask){
        mask = document.createElement('div');
        mask.className = 'cd-future-mask';
        stage.appendChild(mask);
      }
      mask.style.left = pct.toFixed(2) + '%';
      mask.style.width = 'auto';
    }
    // Texte de marketing (rotite pe carduri, ca să nu fie repetitiv).
    const __CD_UNLOCK_TEXTS = [
      'Этот раздел уже рассчитан для тебя. Открой его — и узнай, что он говорит именно о твоей судьбе.',
      'Самое важное — здесь, под размытием. Полный разбор открывается сразу после оплаты.',
      'Твои числа уже говорят. Осталось только прочитать, что именно.',
      'Здесь скрыт ответ, ради которого ты пришёл. Открой полный разбор — он твой навсегда.'
    ];
    function __cdRequestUnlock(){
      try{ window.parent.postMessage({ type: 'unlockRequested' }, '*'); }catch(e){}
    }
    function __cdBadge(card){
      if(card.querySelector(':scope > .cd-unlock')) return;
      const idx = document.querySelectorAll('.cd-unlock').length;
      const wrap = document.createElement('div');
      wrap.className = 'cd-unlock' + (card.offsetHeight < 260 ? ' cd-unlock-compact' : '');
      const t = document.createElement('p');
      t.className = 'cd-unlock-text';
      t.textContent = __CD_UNLOCK_TEXTS[idx % __CD_UNLOCK_TEXTS.length];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cd-unlock-btn';
      b.textContent = 'Открыть полный разбор';
      b.addEventListener('click', __cdRequestUnlock);
      wrap.appendChild(t); wrap.appendChild(b);
      card.appendChild(wrap);
    }
    // Elemente cu propria mască (grafice: trecut clar / viitor blurat) sau interactive — NU primesc blur de card.
    const __CD_BLUR_SKIP = '.section-title, .cd-unlock, .cd-skel';
    // Blur progresiv pe ELEMENTE (nu backdrop-filter): tot ce e sub linia de 30 % a cardului devine blurat,
    // din ce în ce mai puternic spre capătul cardului. Elementele care traversează linia (sau sunt foarte
    // înalte) sunt descompuse în copii, ca zona de sus să rămână clară şi straturile GPU să fie mici.
    function __cdBlurBelow(card){
      const cardTop = card.getBoundingClientRect().top;
      const H = card.offsetHeight;
      if(!H) return;
      const cut = H * 0.3;
      function level(el){
        const r = el.getBoundingClientRect();
        const center = (r.top + r.bottom) / 2 - cardTop;
        const f = Math.max(0, Math.min(1, (center - cut) / Math.max(1, H - cut)));
        return 1 + Math.min(3, Math.floor(f * 4));
      }
      function walk(el){
        if(el.matches(__CD_BLUR_SKIP)) return;
        const r = el.getBoundingClientRect();
        if(!r.height) return;
        const top = r.top - cardTop, bottom = r.bottom - cardTop;
        if(bottom <= cut) return; // complet în zona clară
        const kids = Array.from(el.children);
        const spans = top < cut;
        if((spans || r.height > 900) && kids.length){ kids.forEach(walk); return; }
        el.classList.remove('cd-blur-1','cd-blur-2','cd-blur-3','cd-blur-4');
        el.classList.add('cd-blur-' + level(el));
        // Paragraful care traversează chiar linia de 30 % rămâne text real (blurat) ca partea lui de sus să se citească;
        // tot ce e complet sub linie devine schelet.
        if(!spans) __cdSkeletonize(el, r.height);
      }
      Array.from(card.children).forEach(walk);
    }
    // Înlocuiește conținutul REAL al unui element de sub linia de 30 % cu un schelet vizual de aceeași
    // înălțime: textul premium este eliminat din DOM (nu doar blurat), dar conturul „continuării” rămâne.
    const __CD_SKEL_WIDTHS = [100, 94, 88, 97, 72, 100, 91, 63, 96, 84];
    function __cdSkeletonize(el, height){
      if(el.classList.contains('cd-skel') || el.closest('.cd-skel')) return;
      if(el.closest('.chart-tabs')) return; // tab-urile graficelor rămân interactive
      const h = Math.max(14, Math.round(height || el.getBoundingClientRect().height));
      const isChart = h > 200 || !!el.querySelector('svg, canvas');
      const frag = document.createDocumentFragment();
      if(isChart){
        const head = document.createElement('i'); head.className = 'cd-skel-head'; frag.appendChild(head);
        const block = document.createElement('i'); block.className = 'cd-skel-block'; frag.appendChild(block);
        const tail = Math.min(3, Math.floor((h - 90) / 22));
        for(let i = 0; i < tail; i++){ const l = document.createElement('i'); l.style.width = __CD_SKEL_WIDTHS[i % 10] + '%'; frag.appendChild(l); }
      }else{
        const n = Math.max(1, Math.min(40, Math.round((h - 8) / 20)));
        for(let i = 0; i < n; i++){
          const l = document.createElement('i');
          l.style.width = __CD_SKEL_WIDTHS[i % 10] + '%';
          frag.appendChild(l);
        }
      }
      // Elementele SVG/canvas nu pot găzdui <i>: le înlocuim cu un <div> de aceeași dimensiune.
      let host = el;
      if(el instanceof SVGElement || el.tagName === 'CANVAS' || el.tagName === 'TABLE' || el.tagName === 'UL' || el.tagName === 'OL'){
        host = document.createElement('div');
        host.className = el.getAttribute('class') || '';
        el.replaceWith(host);
      }else{
        host.textContent = '';
      }
      host.classList.add('cd-skel');
      host.style.height = h + 'px';
      host.appendChild(frag);
    }
    function __cdApplyPreviewLock(){
      document.body.classList.add('cd-preview');
      const results = document.getElementById('results');
      if(!results) return;
      results.classList.add('cd-report-part');
      results.style.setProperty('--cd-cut', '30%');
      __cdBlurBelow(results);
      const cutY = results.getBoundingClientRect().top + results.scrollHeight * 0.3;
      Array.from(results.querySelectorAll(':scope > .card')).forEach(function(card){
        if(card.id === 'pdfDownloadCard' || card.id === 'personalDataSummary') return;
        card.classList.add('cd-part');
        if(card.getBoundingClientRect().top >= cutY) __cdBadge(card);
      });
    }

    // Datele formularului — trimise aplicației pentru checkout (emailul este obligatoriu în formular;
    // la plată este doar afişat pentru confirmare).
    function __cdCollectForm(){
      const g = function(id){ const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
      return {
        last: g('lastName'), first: g('firstName'), middle: g('middleName'),
        day: Number(g('day')), month: Number(g('month')), year: Number(g('year')),
        email: g('emailAddr'),
        gender: g('gender'),
        nameAlphabetKey: typeof getNameAlphabetKey === 'function' ? getNameAlphabetKey() : undefined,
        discountCode: (g('promoCode') || '').toUpperCase().replace(/\s+/g, '') || undefined
      };
    }

    // Butonul formularului ORIGINAL: calculează real în acelaşi fişier, apoi arată raportul întreg blurat.
    function __cdWaitForReportData(timeout){
      return new Promise(function(resolve){
        const started = Date.now();
        (function check(){
          if((typeof DB !== 'undefined' && DB) || Date.now() - started >= timeout){
            resolve(typeof DB !== 'undefined' && !!DB);
            return;
          }
          setTimeout(check, 40);
        })();
      });
    }
    async function __cdPreviewCalculate(){
      // Emailul din formular e OPȚIONAL: gol → trece; completat greșit → readMail() afișează eroarea.
      window.__cdSkipMail = false;
      window.__cdPreviewMode = true;
      window.__cdLastResult = null;
      const err = document.getElementById('errMsg');
      if(err) err.style.display = 'none';
      // Ascundem raportul ÎNAINTE de calcul: aplicaţia pune ecranul „Cristalul se formează” peste pagină,
      // iar conţinutul din iframe rămâne invizibil (opacity 0) până când ecranul dispare → nicio străpungere.
      document.body.classList.add('cd-forming');
      window.parent.postMessage({ type: 'previewStarted' }, '*');
      const dataReady = await __cdWaitForReportData(5000);
      if(!dataReady){
        document.body.classList.remove('cd-forming');
        window.parent.postMessage({ type: 'previewFailed' }, '*');
        return;
      }
      if(typeof calculate === 'function') calculate();
      const ok = !!(window.__cdLastResult && document.getElementById('results'));
      if(!ok){
        // Validarea a eşuat → revenim la formular vizibil şi anunţăm aplicaţia să închidă ecranul.
        document.body.classList.remove('cd-forming');
        window.parent.postMessage({ type: 'previewFailed' }, '*');
        return;
      }
      document.body.classList.add('cd-preview');
      __cdApplyPreviewLock();
      window.scrollTo(0, 0);
      const data = __cdCollectForm();
      window.parent.postMessage({ type: 'previewRendered', data: data, height: __cdContentHeight() }, '*');
      setTimeout(function(){
        // Elementele animate (bare, puncte) apar cu întârziere — a doua trecere prinde tot.
        __cdApplyPreviewLock();
        window.parent.postMessage({ type: 'resize', height: __cdContentHeight() }, '*');
      }, 900);
    }
    // Alfabetul se alege automat după literele introduse: vizitatorii din RO/MD primesc 'ro' din geolocație,
    // dar mulți scriu numele în chirilică → fără această corecție apărea eroarea „алфавит не соответствует”.
    function __cdAutoAlphabet(){
      const sel = document.getElementById('nameAlphabetSelect');
      if(!sel || typeof ALPHABETS === 'undefined') return;
      const read = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
      const name = (read('lastName') + read('firstName') + read('middleName')).toUpperCase().replace(/[^\p{L}]/gu, '');
      if(!name) return;
      const ratio = function(key){
        const letters = ALPHABETS[key] && ALPHABETS[key].letters; if(!letters) return 0;
        let hit = 0; for(const ch of name){ if(letters.indexOf(ch) >= 0) hit++; }
        return hit / name.length;
      };
      if(ratio(sel.value) >= 0.5) return;
      const preferred = ['ru', 'ro', 'en', 'uk', 'kk', 'be', 'bg', 'de', 'es', 'it'];
      const keys = preferred.concat(Object.keys(ALPHABETS).filter(function(k){ return preferred.indexOf(k) < 0; }));
      let best = sel.value, bestRatio = ratio(sel.value);
      for(const k of keys){ const r = ratio(k); if(r > bestRatio){ best = k; bestRatio = r; } }
      if(best !== sel.value && bestRatio >= 0.5){
        sel.value = best;
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }
    function cdMainAction(){
      __cdAutoAlphabet();
      if(window.__paymentUnlocked){ if(typeof calculate === 'function') calculate(); return; }
      void __cdPreviewCalculate();
    }
    // Aplicaţia anunţă că ecranul de formare se închide → raportul apare lin.
    window.addEventListener('message', function(ev){
      if(ev.data && ev.data.type === 'previewReveal'){
        document.body.classList.remove('cd-forming');
      }
    });

    // Mod preview din link (ex. întoarcere de la Stripe): completează datele, calculează, apoi blochează.
    (function(){
      const params = new URLSearchParams(window.location.search);
      if(params.get('preview') !== '1') return;
      window.__cdSkipMail = true;
      window.__cdPreviewMode = true;
      window.addEventListener('DOMContentLoaded', async function(){
        const values = {
          lastName: params.get('last') || '',
          firstName: params.get('first') || '',
          middleName: params.get('middle') || '',
          day: params.get('day') || '',
          month: params.get('month') || '',
          year: params.get('year') || '',
        };
        Object.keys(values).forEach(function(id){
          const field = document.getElementById(id);
          if(field) field.value = values[id];
        });
        const gender = params.get('gender');
        if(gender && document.getElementById('gender')){
          document.getElementById('gender').value = gender;
          if(typeof paintGender === 'function') try{ paintGender(); }catch(e){}
        }
        const alpha = params.get('alpha');
        if(alpha && document.getElementById('nameAlphabetSelect')) document.getElementById('nameAlphabetSelect').value = alpha;
        document.body.classList.add('cd-preview');
        await __cdWaitForReportData(5000);
        if(typeof calculate === 'function') calculate();
        const ok = !!(window.__cdLastResult && document.getElementById('results'));
        if(ok) __cdApplyPreviewLock();
        setTimeout(function(){
          // Elementele animate (bare, puncte) apar cu întârziere — a doua trecere prinde tot.
          if(ok) __cdApplyPreviewLock();
          window.parent.postMessage({ type: ok ? 'previewRendered' : 'previewFailed', data: ok ? __cdCollectForm() : null, height: __cdContentHeight() }, '*');
        }, 900);
      });
    })();
</script>

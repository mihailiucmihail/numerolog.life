<script id="cd-report-next-script">
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get('design') !== 'next') return;
  document.documentElement.classList.add('cd-next-design');
  const state = { ready: false, cards: [], timer: 0 };
  const clean = value => String(value == null ? '' : value).trim();
  const send = data => parent.postMessage(data, location.origin);
  const node = (tag, className, text) => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text != null) el.textContent = text;
    return el;
  };
  function buildCover(results, result) {
    const cover = node('section', 'cd-next-cover');
    cover.setAttribute('aria-label', 'Персональный отчёт');
    const top = node('div', 'cd-next-cover-top');
    top.append(node('span', 'cd-next-kicker', 'Персональная карта'), node('span', 'cd-next-edition', 'NUMEROLOG'));
    const main = node('div', 'cd-next-cover-main');
    const name = clean(document.getElementById('pds-name')?.textContent) || [result.lastCyr, result.firstCyr, result.middleCyr].filter(Boolean).join(' ');
    main.append(node('h1', '', 'Кристалл Судьбы'), node('p', 'cd-next-name', name), node('p', 'cd-next-date', clean(document.getElementById('pds-details')?.textContent)));
    const metrics = node('div', 'cd-next-metrics');
    [[result.TP, 'Точка предназначения'], [result.SZ_num, 'Суть задачи'], [result.Prof_num, 'Профессия'], [result.Prizvanie_num, 'Призвание']].forEach(([value, title]) => {
      const metric = node('div', 'cd-next-metric');
      metric.append(node('strong', '', clean(value)), node('span', '', title)); metrics.append(metric);
    });
    cover.append(top, main, metrics); results.prepend(cover);
  }
  function wrapCard(card, index) {
    const title = card.querySelector('.section-title');
    if (!title || card.querySelector(':scope > .cd-next-card-head')) return;
    const head = node('header', 'cd-next-card-head');
    const titles = node('div', 'cd-next-title-wrap');
    const toggle = node('button', 'cd-next-toggle');
    toggle.type = 'button'; toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'Свернуть: ' + clean(title.textContent));
    toggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    const body = node('div', 'cd-next-card-body');
    body.id = 'cd-next-body-' + index; toggle.setAttribute('aria-controls', body.id);
    [...card.childNodes].forEach(child => { if (child !== title) body.append(child); });
    titles.append(node('span', 'cd-next-section-label', 'Раздел ' + (index + 1)), title);
    head.append(titles, toggle); card.append(head, body);
    toggle.addEventListener('click', () => {
      const collapsed = card.classList.toggle('cd-next-collapsed');
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label', (collapsed ? 'Развернуть: ' : 'Свернуть: ') + clean(title.textContent));
      schedulePublish();
    });
  }
  function publishChapters() {
    const chapters = state.cards.map((card, index) => ({ id: card.id, title: clean(card.querySelector('.section-title')?.textContent) || ('Раздел ' + (index + 1)), top: card.getBoundingClientRect().top + window.scrollY, height: card.offsetHeight }));
    const documentHeight = window.__cdContentHeight ? window.__cdContentHeight() : Math.ceil(document.querySelector('.wrap').getBoundingClientRect().bottom + window.scrollY);
    send({ type: 'cdNextChapters', chapters, documentHeight });
    window.__cdSendHeight?.();
  }
  function schedulePublish() {
    if (state.timer) return;
    state.timer = setTimeout(() => { state.timer = 0; publishChapters(); }, 100);
  }
  function initialize() {
    if (state.ready) return;
    const results = document.getElementById('results');
    const result = window.__cdLastResult;
    if (!results || !result || results.querySelectorAll(':scope > .card .section-title').length < 4) return;
    state.ready = true;
    buildCover(results, result);
    state.cards = [...results.querySelectorAll(':scope > .card')].filter(card => card.id !== 'personalDataSummary' && card.querySelector('.section-title') && getComputedStyle(card).display !== 'none');
    state.cards.forEach((card, index) => { card.id = card.id || ('cd-next-section-' + index); wrapCard(card, index); });
    if (params.get('homeExample') === '1') {
      const graphCard = results.querySelector('#lifeChartSvg')?.closest('.card');
      if (graphCard) {
        const action = node('button', 'cd-next-example-cta', 'Рассчитать мой Кристалл');
        action.type = 'button';
        action.addEventListener('click', () => send({ type: 'cdExampleForm' }));
        graphCard.after(action);
      }
    }
    const back = node('button', 'cd-next-backtop', 'Вернуться к началу');
    back.type = 'button'; back.addEventListener('click', () => send({ type: 'cdNextTop' })); results.append(back);
    const resize = new ResizeObserver(schedulePublish); resize.observe(results);
    document.fonts.ready.then(schedulePublish);
    schedulePublish();
  }
  const observer = new MutationObserver(() => { initialize(); if (state.ready) observer.disconnect(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('message', event => {
    if (event.source !== parent || event.origin !== location.origin) return;
    if (event.data?.type === 'cdNextRefresh' && state.ready) schedulePublish();
  });
  window.addEventListener('load', initialize);
  initialize();
})();
</script>

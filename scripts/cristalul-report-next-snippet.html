<script id="cd-report-next-script">
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('design') !== 'next') return;
  document.documentElement.classList.add('cd-next-design');
  const ns='http://www.w3.org/2000/svg';
  const state={ready:false,cards:[],chartTimer:0};
  const clean=value=>String(value==null?'':value).trim();
  const svg=(tag,attrs)=>{const el=document.createElementNS(ns,tag);Object.entries(attrs||{}).forEach(([key,value])=>el.setAttribute(key,String(value)));return el;};

  function prepareDrawing(root){
    root.querySelectorAll('svg path,svg polyline').forEach(line=>{
      if(line.classList.contains('cd-next-draw')||line.classList.contains('cd-next-area')||line.classList.contains('cd-next-underlay'))return;
      const stroke=line.getAttribute('stroke')||getComputedStyle(line).stroke;
      if(!stroke||stroke==='none')return;
      try{const length=line.getTotalLength();if(!Number.isFinite(length)||length<20)return;line.classList.add('cd-next-draw');line.style.strokeDasharray=String(length);line.style.strokeDashoffset=String(length);}catch(error){}
    });
  }

  function gradient(defs,id,stops,attrs){
    const node=svg('linearGradient',{id,...attrs});
    stops.forEach(stop=>node.appendChild(svg('stop',stop)));
    defs.appendChild(node);
  }

  function upgradeLifeChart(){
    const chart=document.getElementById('lifeChartSvg');
    const line=chart?.querySelector('.life-path');
    const path=line?.getAttribute('d');
    if(!chart||!line||!path||line.dataset.nextPremium===path)return;
    line.dataset.nextPremium=path;
    chart.querySelectorAll('.cd-next-generated').forEach(node=>node.remove());
    let defs=chart.querySelector('defs');
    if(!defs){defs=svg('defs');chart.insertBefore(defs,chart.firstChild);}
    defs.querySelectorAll('[id^="cdNext"]').forEach(node=>node.remove());
    gradient(defs,'cdNextLineGradient',[{offset:'0%','stop-color':'#a8b0c3'},{offset:'45%','stop-color':'#d8ad55'},{offset:'100%','stop-color':'#f4efe6'}],{x1:'0',y1:'0',x2:'1',y2:'0'});
    gradient(defs,'cdNextAreaGradient',[{offset:'0%','stop-color':'#d8ad55','stop-opacity':'.34'},{offset:'72%','stop-color':'#d8ad55','stop-opacity':'.05'},{offset:'100%','stop-color':'#d8ad55','stop-opacity':'0'}],{x1:'0',y1:'0',x2:'0',y2:'1'});
    const glow=svg('filter',{id:'cdNextLineGlow',x:'-30%',y:'-30%',width:'160%',height:'160%'});glow.innerHTML='<feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>';defs.appendChild(glow);
    const blur=svg('filter',{id:'cdNextLineBlur',x:'-30%',y:'-30%',width:'160%',height:'160%'});blur.appendChild(svg('feGaussianBlur',{stdDeviation:'6'}));defs.appendChild(blur);
    const point=svg('filter',{id:'cdNextPointGlow',x:'-100%',y:'-100%',width:'300%',height:'300%'});point.innerHTML='<feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>';defs.appendChild(point);
    const coords=[...path.matchAll(/[ML]\s*([\d.]+),([\d.]+)/g)].map(match=>({x:Number(match[1]),y:Number(match[2])}));
    if(coords.length>1){
      const area=svg('path',{d:path+' L'+coords.at(-1).x+',286 L'+coords[0].x+',286 Z',class:'cd-next-area cd-next-generated'});
      const underlay=svg('path',{d:path,class:'cd-next-underlay cd-next-generated'});
      chart.insertBefore(area,line);chart.insertBefore(underlay,line);
    }
    const orbit=svg('circle',{r:'3.5',class:'cd-next-orbit cd-next-generated'});
    orbit.appendChild(svg('animateMotion',{dur:'5.2s',repeatCount:'indefinite',path,calcMode:'linear'}));
    chart.appendChild(orbit);
    prepareDrawing(chart.closest('.card')||chart);
  }

  function upgradeDataVisuals(results){
    results.querySelectorAll('.pyth-cell').forEach((cell,index)=>cell.style.transitionDelay=((index%9)*42)+'ms');
    results.querySelectorAll('.yc-bar').forEach((bar,index)=>{
      if(bar.dataset.nextAnimated)return;
      bar.dataset.nextAnimated='true';
      const height=bar.style.height||((bar.dataset.h||0)+'%');
      bar.style.height='0%';bar.style.transition='height .9s cubic-bezier(.2,.8,.2,1) '+(index*45)+'ms';
      requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.height=height));
    });
    upgradeLifeChart();
  }

  function buildCover(results,result){
    const name=clean(document.getElementById('pds-name')?.textContent)||[result.lastCyr,result.firstCyr,result.middleCyr].filter(Boolean).join(' ');
    const details=clean(document.getElementById('pds-details')?.textContent);
    const cover=document.createElement('section');
    cover.className='cd-next-cover';cover.setAttribute('aria-label','Обложка персонального отчёта');
    cover.innerHTML='<div class="cd-next-cover-top"><span class="cd-next-kicker">Персональная карта</span><span class="cd-next-edition">NUMEROLOG · 2026</span></div><div class="cd-next-cover-main"><h1>Кристалл<br>Судьбы</h1><p class="cd-next-name"></p><p class="cd-next-date"></p></div><div class="cd-next-metrics" aria-label="Ключевые числа"><div class="cd-next-metric"><strong>'+clean(result.TP)+'</strong><span>Точка предназначения</span></div><div class="cd-next-metric"><strong>'+clean(result.SZ_num)+'</strong><span>Суть задачи</span></div><div class="cd-next-metric"><strong>'+clean(result.Prof_num)+'</strong><span>Профессия</span></div><div class="cd-next-metric"><strong>'+clean(result.Prizvanie_num)+'</strong><span>Призвание</span></div></div>';
    cover.querySelector('.cd-next-name').textContent=name;cover.querySelector('.cd-next-date').textContent=details;
    results.insertBefore(cover,results.firstChild);
  }

  function wrapCard(card,index){
    const title=card.querySelector('.section-title');
    if(!title||card.querySelector(':scope>.cd-next-card-head'))return;
    const head=document.createElement('header');head.className='cd-next-card-head';
    const titleWrap=document.createElement('div');titleWrap.className='cd-next-title-wrap';
    const label=document.createElement('span');label.className='cd-next-section-label';label.textContent='Раздел '+String(index+1).padStart(2,'0');
    const toggle=document.createElement('button');toggle.type='button';toggle.className='cd-next-toggle';toggle.setAttribute('aria-expanded','true');toggle.setAttribute('aria-label','Свернуть раздел');toggle.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const body=document.createElement('div');body.className='cd-next-card-body';
    [...card.childNodes].forEach(node=>{if(node!==title)body.appendChild(node);});
    titleWrap.append(label,title);head.append(titleWrap,toggle);card.append(head,body);
    toggle.addEventListener('click',()=>{
      const collapsed=card.classList.toggle('cd-next-collapsed');
      toggle.setAttribute('aria-expanded',String(!collapsed));toggle.setAttribute('aria-label',collapsed?'Развернуть раздел':'Свернуть раздел');
      setTimeout(()=>{publishChapters();window.__cdSendHeight?.();},40);
    });
    card.addEventListener('pointermove',event=>{const rect=card.getBoundingClientRect();card.style.setProperty('--mx',(event.clientX-rect.left)+'px');card.style.setProperty('--my',(event.clientY-rect.top)+'px');});
    card.addEventListener('pointerenter',()=>card.classList.add('cd-next-focused'));
    card.addEventListener('pointerleave',()=>card.classList.remove('cd-next-focused'));
    card.addEventListener('click',event=>{if(!event.target.closest('button,a,input,select,textarea')){state.cards.forEach(item=>item.classList.remove('cd-next-focused'));card.classList.add('cd-next-focused');}});
  }

  function publishChapters(){
    const chapters=state.cards.map((card,index)=>({id:card.id,title:clean(card.querySelector('.section-title')?.textContent)||('Раздел '+(index+1)),top:card.offsetTop,height:card.offsetHeight}));
    parent.postMessage({type:'cdNextChapters',chapters,documentHeight:document.documentElement.scrollHeight},'*');
  }
  function reveal(index){state.cards.forEach((card,i)=>{if(i<=index+1)card.classList.add('cd-next-visible');});}

  function initialize(){
    if(state.ready)return;
    const results=document.getElementById('results');const result=window.__cdLastResult;
    const sections=results?.querySelectorAll(':scope>.card .section-title');
    if(!results||!result||!sections||sections.length<4)return;
    state.ready=true;buildCover(results,result);
    state.cards=Array.from(results.querySelectorAll(':scope>.card')).filter(card=>card.id!=='personalDataSummary'&&getComputedStyle(card).display!=='none');
    state.cards.forEach((card,index)=>{card.id=card.id||('cd-next-section-'+index);wrapCard(card,index);prepareDrawing(card);});
    const revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('cd-next-visible');revealObserver.unobserve(entry.target);}}),{rootMargin:'180px 0px',threshold:.02});
    state.cards.forEach(card=>revealObserver.observe(card));
    upgradeDataVisuals(results);reveal(0);
    const back=document.createElement('button');back.type='button';back.className='cd-next-backtop';back.textContent='Вернуться к началу';back.addEventListener('click',()=>parent.postMessage({type:'cdNextTop'},'*'));results.appendChild(back);
    document.getElementById('chartTabs')?.addEventListener('click',()=>setTimeout(upgradeLifeChart,80));
    requestAnimationFrame(()=>{publishChapters();window.__cdSendHeight?.();});setTimeout(publishChapters,900);
  }

  window.addEventListener('message',event=>{if(event.data?.type==='cdNextViewport')reveal(Number(event.data.activeIndex)||0);if(event.data?.type==='cdNextRefresh')publishChapters();});
  const observer=new MutationObserver(records=>{initialize();if(state.ready&&records.some(record=>record.target.id==='lifeChartSvg'||record.target.closest?.('#lifeChartSvg')))clearTimeout(state.chartTimer),state.chartTimer=setTimeout(upgradeLifeChart,80);});
  observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style']});
  window.addEventListener('load',()=>{initialize();setTimeout(initialize,500);setTimeout(initialize,1400);});
})();
</script>

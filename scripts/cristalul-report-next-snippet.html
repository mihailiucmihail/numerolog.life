<script id="cd-report-next-script">
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get('design') !== 'next') return;
  document.documentElement.classList.add('cd-next-design');
  const state = { ready: false, cards: [], timer: 0 };
  const clean = value => String(value == null ? '' : value).trim();
  const ns = 'http://www.w3.org/2000/svg';
  const send = data => parent.postMessage(data, location.origin);
  const node = (tag, className, text) => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text != null) el.textContent = text;
    return el;
  };
  function readout(host, instruction) {
    let output = host.querySelector(':scope > .cd-next-readout');
    if (!output) {
      output = node('output', 'cd-next-readout', instruction);
      output.setAttribute('aria-live', 'polite');
      host.append(output);
    }
    return output;
  }
  function legend(host, items) {
    if (host.querySelector(':scope > .cd-next-legend')) return;
    const row = node('div', 'cd-next-legend');
    items.forEach(([tone, label]) => {
      const item = node('span');
      item.dataset.tone = tone;
      const swatch = node('i');
      swatch.setAttribute('aria-hidden', 'true');
      item.append(swatch, document.createTextNode(label));
      row.append(item);
    });
    host.append(row);
  }
  function selectData(target, output, label, onSelect) {
    if (target.dataset.nextInteractive) return;
    target.dataset.nextInteractive = '1';
    target.classList.add('cd-next-data-target');
    target.setAttribute('tabindex', '0');
    target.setAttribute('role', 'button');
    target.setAttribute('aria-label', label);
    target.setAttribute('aria-pressed', 'false');
    const activate = () => {
      const region = target.closest('.cd-next-card-body');
      region?.querySelectorAll('[aria-pressed="true"]').forEach(el => el.setAttribute('aria-pressed', 'false'));
      target.setAttribute('aria-pressed', 'true');
      output.textContent = label;
      onSelect?.();
    };
    target.addEventListener('click', activate);
    target.addEventListener('focus', () => { output.textContent = label; });
    target.addEventListener('pointerenter', () => { output.textContent = label; });
    target.addEventListener('keydown', event => {
      if (event.isComposing || event.keyCode === 229) return;
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); }
    });
  }
  function upgradeLifeChart() {
    const chart = document.getElementById('lifeChartSvg');
    const host = chart?.closest('.chart-stage')?.parentElement;
    if (!chart || !host || !chart.querySelector('.life-path')) return;
    document.querySelectorAll('.chart-tab').forEach(tab => tab.setAttribute('aria-pressed', String(tab.classList.contains('active'))));
    let tools = host.querySelector('.cd-next-life-tools');
    if (!tools) { tools = node('div', 'cd-next-life-tools'); chart.closest('.chart-stage').after(tools); }
    legend(tools, [['gold', 'Основная линия'], ['teal', 'Сейчас / сравнение'], ['rose', 'Среднее значение']]);
    const output = readout(tools, 'Выберите точку: возраст и значение появятся здесь. На узком экране график можно прокрутить.');
    chart.querySelectorAll('.life-point, .life-point-2').forEach(point => {
      const age = Number(point.dataset.plotage || point.dataset.age);
      const level = Number(point.dataset.level);
      if (!Number.isFinite(age) || !Number.isFinite(level)) return;
      const series = point.classList.contains('life-point-2') ? 'Сравнение' : 'Основная линия';
      selectData(point, output, series + ' · Возраст: ' + age.toFixed(1).replace(/\.0$/, '') + ' · Значение: ' + level);
    });
  }
  function upgradeBars(results) {
    results.querySelectorAll('#yearlyCycleChart, #qualityOfLifeChart').forEach(host => {
      const quality = host.id === 'qualityOfLifeChart';
      legend(host, quality
        ? [['rose', '0–3'], ['gold', '4–6'], ['teal', '7–9 · текущий возраст обведён']]
        : [['gold', 'Годы цикла'], ['teal', 'Текущий год']]);
      const output = readout(host, 'Выберите столбец, чтобы увидеть его значения. График прокручивается по горизонтали.');
      host.querySelectorAll('.yc-bar-wrap').forEach(wrap => {
        const value = clean(wrap.querySelector('.yc-num')?.textContent);
        const period = clean(wrap.querySelector('.yc-year')?.textContent);
        const extra = clean(wrap.querySelector('.yc-pn')?.textContent);
        selectData(wrap, output, (quality ? 'Возраст: ' : 'Год: ') + period + ' · Значение: ' + value + (extra ? ' · ' + extra : ''));
      });
    });
  }
  function upgradeMatrices(results) {
    results.querySelectorAll('.pyth-grid').forEach(grid => {
      const host = grid.parentElement;
      const output = readout(host, 'Выберите ячейку для просмотра значений.');
      const items = [];
      if (grid.querySelector('.opornaya')) items.push(['gold', 'Опорная ячейка']);
      if (grid.querySelector('.transferred')) items.push(['teal', 'Перенос']);
      if (items.length) legend(host, items);
      grid.querySelectorAll('.pyth-cell').forEach(cell => {
        const channel = clean(cell.querySelector('.chan')?.textContent);
        const digits = [...cell.querySelectorAll('.digit')].map(el => clean(el.textContent)).join(', ');
        const status = cell.classList.contains('empty') ? 'Нет чисел' : cell.classList.contains('transferred') ? 'Перенос' : cell.classList.contains('opornaya') ? 'Опорная ячейка' : 'Числа';
        selectData(cell, output, [channel, status, digits].filter(Boolean).join(' · '));
      });
    });
  }
  function upgradeMandala(chart) {
    if (chart.dataset.nextInteractive) return;
    chart.dataset.nextInteractive = '1';
    const frame = node('div', 'cd-next-chart-scroll');
    chart.before(frame);
    frame.append(chart);
    const host = node('div', 'cd-next-mandala');
    frame.before(host);
    host.append(frame);
    chart.querySelectorAll('polygon.mandala-zone-poly').forEach(zone => {
      const negative = (zone.getAttribute('fill') || '').includes('192,57,43');
      zone.style.fill = negative ? 'var(--cdn-rose)' : 'var(--cdn-teal)';
      zone.style.fillOpacity = '.18';
    });
    legend(host, [['gold', 'Пройденный путь'], ['teal', 'Продолжение / выше оси'], ['rose', 'Ниже оси']]);
    const points = [...chart.querySelectorAll('.mandala-past-line, .mandala-future-line')].flatMap(line =>
      clean(line.getAttribute('points')).split(/\s+/).map(pair => pair.split(',').map(Number))
    ).filter(pair => pair.length === 2 && pair.every(Number.isFinite)).sort((a, b) => a[0] - b[0]);
    const axisTick = [...chart.querySelectorAll('text')].find(text => Number(text.getAttribute('y')) === 232 && Number(text.textContent) > 0);
    if (!points.length || !axisTick) return;
    // Read the scale from the rendered ticks; do not recalculate report data.
    const pixelsPerYear = (Number(axisTick.getAttribute('x')) - 34) / Number(axisTick.textContent);
    if (!Number.isFinite(pixelsPerYear) || pixelsPerYear <= 0) return;
    const output = readout(host, '');
    const label = node('label', 'cd-next-chart-control', 'Возраст');
    const input = node('input');
    input.type = 'range'; input.min = '0'; input.max = String(Math.round((points.at(-1)[0] - 34) / pixelsPerYear));
    input.step = '1'; input.value = chart.dataset.curAge || '0';
    label.append(input); output.before(label);
    const marker = document.createElementNS(ns, 'circle');
    marker.setAttribute('class', 'cd-next-selected-point'); marker.setAttribute('r', '5');
    chart.append(marker);
    const update = () => {
      const x = 34 + Number(input.value) * pixelsPerYear;
      const point = points.reduce((best, p) => Math.abs(p[0] - x) < Math.abs(best[0] - x) ? p : best, points[0]);
      const age = Math.round((point[0] - 34) / pixelsPerYear);
      const value = Math.max(0, Math.min(9, Math.round((214 - point[1]) * 9 / 202)));
      marker.setAttribute('cx', point[0]); marker.setAttribute('cy', point[1]);
      output.textContent = 'Возраст: ' + age + ' · Значение: ' + value;
      input.setAttribute('aria-valuetext', output.textContent);
      const scale = chart.getBoundingClientRect().width / 1000;
      frame.scrollLeft = Math.max(0, point[0] * scale - frame.clientWidth / 2);
    };
    input.addEventListener('input', update);
    chart.addEventListener('click', event => {
      const rect = chart.getBoundingClientRect();
      input.value = String(Math.round(((event.clientX - rect.left) * 1000 / rect.width - 34) / pixelsPerYear));
      update();
    });
    update();
  }
  function upgradeTimeline() {
    const host = document.getElementById('metaTimeline');
    if (!host) return;
    legend(host, [['gold', 'МЦ1'], ['teal', 'МЦ2'], ['rose', 'МЦ3']]);
    host.closest('.card').querySelectorAll('.meta-block-head').forEach(head => {
      if (head.style.cursor === 'default') return;
      head.setAttribute('role', 'button'); head.tabIndex = 0;
      const expanded = () => head.setAttribute('aria-expanded', String(head.closest('.meta-block').classList.contains('active')));
      expanded(); head.addEventListener('click', expanded);
      head.addEventListener('keydown', event => {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); head.click(); }
      });
    });
  }
  function buildCover(results, result) {
    const cover = node('section', 'cd-next-cover');
    cover.setAttribute('aria-label', 'Персональный отчёт');
    const top = node('div', 'cd-next-cover-top');
    top.append(node('span', 'cd-next-kicker', 'Персональная карта'), node('span', 'cd-next-edition', 'NUMEROLOG'));
    const main = node('div', 'cd-next-cover-main');
    const name = clean(document.getElementById('pds-name')?.textContent) || [result.lastCyr, result.firstCyr, result.middleCyr].filter(Boolean).join(' ');
    main.append(node('h1', '', 'Кристалл Судьбы'), node('p', 'cd-next-name', name), node('p', 'cd-next-date', clean(document.getElementById('pds-details')?.textContent)));
    const metrics = node('div', 'cd-next-metrics');
    [[result.TP, 'Точка предназначения'], [result.SZ_num, 'Суть задачи'], [result.Prof_num, 'Профессия'], [result.Prizvanie_num, 'Призвание']].forEach(([value, title]) => {
      const metric = node('div', 'cd-next-metric');
      metric.append(node('strong', '', clean(value)), node('span', '', title)); metrics.append(metric);
    });
    cover.append(top, main, metrics); results.prepend(cover);
  }
  function wrapCard(card, index) {
    const title = card.querySelector('.section-title');
    if (!title || card.querySelector(':scope > .cd-next-card-head')) return;
    const head = node('header', 'cd-next-card-head');
    const titles = node('div', 'cd-next-title-wrap');
    const toggle = node('button', 'cd-next-toggle');
    toggle.type = 'button'; toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'Свернуть: ' + clean(title.textContent));
    toggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    const body = node('div', 'cd-next-card-body');
    body.id = 'cd-next-body-' + index; toggle.setAttribute('aria-controls', body.id);
    [...card.childNodes].forEach(child => { if (child !== title) body.append(child); });
    titles.append(node('span', 'cd-next-section-label', 'Раздел ' + (index + 1)), title);
    head.append(titles, toggle); card.append(head, body);
    toggle.addEventListener('click', () => {
      const collapsed = card.classList.toggle('cd-next-collapsed');
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.setAttribute('aria-label', (collapsed ? 'Развернуть: ' : 'Свернуть: ') + clean(title.textContent));
      schedulePublish();
    });
  }
  function publishChapters() {
    const chapters = state.cards.map((card, index) => ({ id: card.id, title: clean(card.querySelector('.section-title')?.textContent) || ('Раздел ' + (index + 1)), top: card.getBoundingClientRect().top + window.scrollY, height: card.offsetHeight }));
    const documentHeight = window.__cdContentHeight ? window.__cdContentHeight() : Math.ceil(document.querySelector('.wrap').getBoundingClientRect().bottom + window.scrollY);
    send({ type: 'cdNextChapters', chapters, documentHeight });
    window.__cdSendHeight?.();
  }
  function schedulePublish() {
    if (state.timer) return;
    state.timer = setTimeout(() => { state.timer = 0; publishChapters(); }, 100);
  }
  function initialize() {
    if (state.ready) return;
    const results = document.getElementById('results');
    const result = window.__cdLastResult;
    if (!results || !result || results.querySelectorAll(':scope > .card .section-title').length < 4) return;
    state.ready = true;
    buildCover(results, result);
    state.cards = [...results.querySelectorAll(':scope > .card')].filter(card => card.id !== 'personalDataSummary' && card.querySelector('.section-title') && getComputedStyle(card).display !== 'none');
    state.cards.forEach((card, index) => { card.id = card.id || ('cd-next-section-' + index); wrapCard(card, index); });
    upgradeLifeChart(); upgradeBars(results); upgradeMatrices(results); upgradeTimeline();
    results.querySelectorAll('.mandala-chart-svg').forEach(upgradeMandala);
    const back = node('button', 'cd-next-backtop', 'Вернуться к началу');
    back.type = 'button'; back.addEventListener('click', () => send({ type: 'cdNextTop' })); results.append(back);
    const resize = new ResizeObserver(schedulePublish); resize.observe(results);
    const life = document.getElementById('lifeChartSvg');
    if (life) new MutationObserver(upgradeLifeChart).observe(life, { childList: true });
    document.fonts.ready.then(schedulePublish);
    schedulePublish();
  }
  const observer = new MutationObserver(() => { initialize(); if (state.ready) observer.disconnect(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('message', event => {
    if (event.source !== parent || event.origin !== location.origin) return;
    if (event.data?.type === 'cdNextRefresh' && state.ready) schedulePublish();
  });
  window.addEventListener('load', initialize);
  initialize();
})();
</script>

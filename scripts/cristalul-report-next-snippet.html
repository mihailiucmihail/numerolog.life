<script id="cd-report-next-script">
(function(){
  const params = new URLSearchParams(location.search);
  if(params.get('design') !== 'next') return;
  document.documentElement.classList.add('cd-next-design');

  const svgNs = 'http://www.w3.org/2000/svg';
  const state = { ready:false, cards:[], chartTimer:0 };
  const clean = (value) => String(value == null ? '' : value).trim();
  const sectionNumber = (index) => 'Раздел ' + String(index + 1).padStart(2, '0');
  const svgElement = (tag,attributes) => {
    const element = document.createElementNS(svgNs,tag);
    Object.entries(attributes || {}).forEach(([key,value]) => element.setAttribute(key,String(value)));
    return element;
  };

  function prepareDrawing(card){
    card.querySelectorAll('svg path,svg polyline').forEach(function(line){
      if(line.classList.contains('cd-next-draw') || line.classList.contains('cd-next-area') || line.classList.contains('cd-next-underlay')) return;
      const stroke = line.getAttribute('stroke') || getComputedStyle(line).stroke;
      if(!stroke || stroke === 'none') return;
      try{
        const length = line.getTotalLength();
        if(!Number.isFinite(length) || length < 20) return;
        line.classList.add('cd-next-draw');
        line.style.strokeDasharray = String(length);
        line.style.strokeDashoffset = String(length);
      }catch(error){}
    });
  }

  function addGradient(defs,id,stops,attributes){
    const gradient = svgElement('linearGradient',{ id:id,...attributes });
    stops.forEach(function(stop){ gradient.appendChild(svgElement('stop',stop)); });
    defs.appendChild(gradient);
  }

  function upgradeLifeChart(){
    const svg = document.getElementById('lifeChartSvg');
    const line = svg?.querySelector('.life-path');
    const pathData = line?.getAttribute('d');
    if(!svg || !line || !pathData || line.dataset.nextPremium === pathData) return;
    line.dataset.nextPremium = pathData;
    svg.querySelectorAll('.cd-next-generated').forEach(function(node){ node.remove(); });

    let defs = svg.querySelector('defs');
    if(!defs){ defs = svgElement('defs'); svg.insertBefore(defs,svg.firstChild); }
    defs.querySelectorAll('[id^="cdNext"]').forEach(function(node){ node.remove(); });
    addGradient(defs,'cdNextLineGradient',[
      {offset:'0%','stop-color':'#aaa7b2'},
      {offset:'48%','stop-color':'#d9a94f'},
      {offset:'100%','stop-color':'#f5f1e8'}
    ],{x1:'0',y1:'0',x2:'1',y2:'0'});
    addGradient(defs,'cdNextAreaGradient',[
      {offset:'0%','stop-color':'#d9a94f','stop-opacity':'.28'},
      {offset:'70%','stop-color':'#d9a94f','stop-opacity':'.06'},
      {offset:'100%','stop-color':'#d9a94f','stop-opacity':'0'}
    ],{x1:'0',y1:'0',x2:'0',y2:'1'});

    const glow = svgElement('filter',{id:'cdNextLineGlow',x:'-30%',y:'-30%',width:'160%',height:'160%'});
    glow.innerHTML = '<feGaussianBlur stdDeviation="2.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(glow);
    const blur = svgElement('filter',{id:'cdNextLineBlur',x:'-30%',y:'-30%',width:'160%',height:'160%'});
    blur.appendChild(svgElement('feGaussianBlur',{stdDeviation:'5'}));
    defs.appendChild(blur);
    const pointGlow = svgElement('filter',{id:'cdNextPointGlow',x:'-100%',y:'-100%',width:'300%',height:'300%'});
    pointGlow.innerHTML = '<feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(pointGlow);

    const coordinates = [...pathData.matchAll(/[ML]\s*([\d.]+),([\d.]+)/g)].map(function(match){ return {x:Number(match[1]),y:Number(match[2])}; });
    if(coordinates.length > 1){
      const areaData = pathData + ' L' + coordinates[coordinates.length - 1].x + ',286 L' + coordinates[0].x + ',286 Z';
      const area = svgElement('path',{d:areaData,class:'cd-next-area cd-next-generated'});
      const underlay = svgElement('path',{d:pathData,class:'cd-next-underlay cd-next-generated'});
      svg.insertBefore(area,line);
      svg.insertBefore(underlay,line);
    }

    const orbit = svgElement('circle',{r:'3.2',class:'cd-next-orbit cd-next-generated'});
    const motion = svgElement('animateMotion',{dur:'5.5s',repeatCount:'indefinite',path:pathData,keyTimes:'0;1',calcMode:'linear'});
    orbit.appendChild(motion);
    svg.appendChild(orbit);
    prepareDrawing(svg.closest('.card') || svg);
  }

  function upgradeDataVisuals(results){
    results.querySelectorAll('.pyth-cell').forEach(function(cell,index){ cell.style.transitionDelay = String((index % 9) * 45) + 'ms'; });
    results.querySelectorAll('.yc-bar').forEach(function(bar,index){
      if(bar.dataset.nextAnimated) return;
      bar.dataset.nextAnimated = 'true';
      const height = bar.style.height || bar.dataset.h + '%';
      bar.style.height = '0%';
      bar.style.transitionDelay = String(index * 55) + 'ms';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ bar.style.height = height; }); });
    });
    upgradeLifeChart();
  }

  function scheduleChartUpgrade(){
    clearTimeout(state.chartTimer);
    state.chartTimer = window.setTimeout(function(){ upgradeLifeChart(); },60);
  }

  function buildCover(results,result){
    const name = clean(document.getElementById('pds-name')?.textContent) || [result.lastCyr,result.firstCyr,result.middleCyr].filter(Boolean).join(' ');
    const details = clean(document.getElementById('pds-details')?.textContent);
    const cover = document.createElement('section');
    cover.className = 'cd-next-cover';
    cover.setAttribute('aria-label','Обложка персонального отчёта');
    cover.innerHTML = '<div class="cd-next-cover-top"><span class="cd-next-kicker">Персональный код судьбы</span><span class="cd-next-edition">NUMEROLOG · 2026</span></div>' +
      '<div class="cd-next-cover-main"><h1>Кристалл Судьбы</h1><p class="cd-next-name"></p><p class="cd-next-date"></p></div>' +
      '<div class="cd-next-metrics" aria-label="Ключевые числа">' +
      '<div class="cd-next-metric"><strong>' + clean(result.TP) + '</strong><span>Точка предназначения</span></div>' +
      '<div class="cd-next-metric"><strong>' + clean(result.SZ_num) + '</strong><span>Суть задачи</span></div>' +
      '<div class="cd-next-metric"><strong>' + clean(result.Prof_num) + '</strong><span>Профессия</span></div>' +
      '<div class="cd-next-metric"><strong>' + clean(result.Prizvanie_num) + '</strong><span>Призвание</span></div>' +
      '</div>';
    cover.querySelector('.cd-next-name').textContent = name;
    cover.querySelector('.cd-next-date').textContent = details;
    results.insertBefore(cover,results.firstChild);
  }

  function publishChapters(){
    const chapters = state.cards.map(function(card,index){
      return { id:card.id,title:clean(card.querySelector('.section-title')?.textContent) || ('Раздел ' + (index + 1)),top:card.offsetTop,height:card.offsetHeight };
    });
    parent.postMessage({type:'cdNextChapters',chapters:chapters,documentHeight:document.documentElement.scrollHeight},'*');
  }

  function reveal(index){
    state.cards.forEach(function(card,cardIndex){
      if(cardIndex <= index + 1) card.classList.add('cd-next-visible');
    });
  }

  function initialize(){
    if(state.ready) return;
    const results = document.getElementById('results');
    const result = window.__cdLastResult;
    const sections = results?.querySelectorAll(':scope > .card .section-title');
    if(!results || !result || !sections || sections.length < 4) return;
    state.ready = true;
    buildCover(results,result);
    state.cards = Array.from(results.querySelectorAll(':scope > .card')).filter(function(card){ return card.id !== 'personalDataSummary' && getComputedStyle(card).display !== 'none'; });
    state.cards.forEach(function(card,index){
      card.id = card.id || ('cd-next-section-' + index);
      card.dataset.nextNumber = sectionNumber(index);
      prepareDrawing(card);
    });
    upgradeDataVisuals(results);
    reveal(0);
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'cd-next-backtop';
    back.textContent = 'Вернуться к началу';
    back.addEventListener('click',function(){ parent.postMessage({type:'cdNextTop'},'*'); });
    results.appendChild(back);
    document.getElementById('chartTabs')?.addEventListener('click',scheduleChartUpgrade);
    requestAnimationFrame(function(){ publishChapters(); window.__cdSendHeight?.(); });
    setTimeout(publishChapters,800);
  }

  window.addEventListener('message',function(event){
    if(event.data?.type === 'cdNextViewport') reveal(Number(event.data.activeIndex) || 0);
    if(event.data?.type === 'cdNextRefresh') publishChapters();
  });
  const observer = new MutationObserver(function(records){
    initialize();
    if(state.ready && records.some(function(record){ return record.target.id === 'lifeChartSvg' || record.target.closest?.('#lifeChartSvg'); })) scheduleChartUpgrade();
  });
  observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style']});
  window.addEventListener('load',function(){ initialize(); setTimeout(initialize,500); setTimeout(initialize,1400); });
})();
</script>

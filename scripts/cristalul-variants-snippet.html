<style id="cd-variants">
/* Stratul de variante pentru experimentele FORM si PREVIEW.
   Se activeaza DOAR prin ?fv= / ?pv= trimise de aplicatie din atribuirea semnata.
   Fara parametri, fisierul se comporta exact ca inainte (varianta de referinta). */

[data-cd-form="form-compact"] .cd-field-hint,
[data-cd-form="form-compact"] .cd-main-cta-note,
[data-cd-form="form-compact"] .numerology-intro { display: none !important; }
[data-cd-form="form-compact"] #inputFormCard { padding-top: 10px !important; padding-bottom: 12px !important; }
[data-cd-form="form-compact"] #inputFormCard label { margin-bottom: 2px; font-size: 10px; }
[data-cd-form="form-compact"] #inputFormCard input,
[data-cd-form="form-compact"] #inputFormCard select { padding-top: 8px; padding-bottom: 8px; }

.cd-v-lead {
  margin: 0 0 16px; padding: 14px 16px; border-radius: 14px;
  /* Cardul are fundal inchis: un panou deschis ar lasa textul ilizibil. */
  background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.10); color: inherit;
}
.cd-v-lead h3 { margin: 0 0 6px; font-size: 15px; line-height: 1.35; font-weight: 600; }
.cd-v-lead p { margin: 0; font-size: 13.5px; line-height: 1.55; opacity: .85; }
.cd-v-lead ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; opacity: .88; }

.cd-v-stepped { display: block !important; }
.cd-v-step[hidden] { display: none !important; }
.cd-v-nav { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.cd-v-nav[hidden] { display: none !important; }
.cd-v-nav button {
  flex: 1; min-height: 44px; border-radius: 14px; border: 0; cursor: pointer;
  font: inherit; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
}
.cd-v-next { background: #1c1a2e; color: #fff; }
.cd-v-nav .cd-v-back { flex: 0 0 auto; padding: 0 16px; background: transparent; color: inherit; opacity: .6; text-decoration: underline; }
.cd-v-progress { display: flex; gap: 6px; margin: 0 0 12px; }
.cd-v-progress i { flex: 1; height: 3px; border-radius: 3px; background: rgba(0,0,0,.12); }
.cd-v-progress i.is-on { background: #1c1a2e; }
.cd-v-progress-label { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .55; }

[data-cd-motion="2"] .cd-v-step, [data-cd-motion="3"] .cd-v-step { animation: cdStepIn .28s ease both; }
[data-cd-motion="3"] .cd-v-step { animation-duration: .42s; }
@keyframes cdStepIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  [data-cd-motion] .cd-v-step { animation: none !important; }
}

/* Preview variante - DOM real al previzualizarii native: #previewLayer > .pv-screen ... .pv-card / .pv-card-head. */
[data-cd-preview="preview-single-insight"] #previewLayer .pv-card:nth-of-type(n+2) { display: none !important; }

[data-cd-preview="preview-card-personal"] #previewLayer .pv-card:first-of-type {
  border: 1px solid rgba(212,175,55,.40) !important;
  box-shadow: 0 14px 46px rgba(0,0,0,.18) !important;
}

[data-cd-preview="preview-timeline"] #previewLayer .pv-card { position: relative; padding-left: 26px !important; }
[data-cd-preview="preview-timeline"] #previewLayer .pv-card::before {
  content: ""; position: absolute; left: 8px; top: 22px; bottom: -12px; width: 2px; background: rgba(255,255,255,.14);
}
[data-cd-preview="preview-timeline"] #previewLayer .pv-card::after {
  content: ""; position: absolute; left: 3px; top: 18px; width: 11px; height: 11px; border-radius: 50%;
  background: #d4af37; box-shadow: 0 0 0 3px rgba(212,175,55,.18);
}
[data-cd-preview="preview-timeline"] #previewLayer .pv-card:last-of-type::before { display: none; }

[data-cd-preview="preview-theme-answer"] #previewLayer .pv-screen:not(.pv-themes) .pv-card { opacity: .78; }
[data-cd-preview="preview-theme-answer"] #previewLayer .pv-themes .pv-card { box-shadow: 0 12px 44px rgba(0,0,0,.16); }

[data-cd-preview="preview-structure-map"] #previewLayer .pv-card { padding: 12px 14px !important; margin-bottom: 8px !important; }
[data-cd-preview="preview-structure-map"] #previewLayer .pv-card > *:not(.pv-card-head) { display: none !important; }
</style>
<script>
(function () {
  'use strict';
  var FORMS = ['form-baseline','form-single-question','form-progressive','form-question-first','form-compact','form-proof-led',
               'form-date-first','form-name-meaning','form-chat','form-visual-map','form-theme-led','form-minimal-dark'];
  var PREVIEWS = ['preview-baseline','preview-single-insight','preview-card-personal','preview-timeline','preview-theme-answer',
                  'preview-structure-map','preview-graph-led','preview-question-answer','preview-strength-risk',
                  'preview-progressive-reveal','preview-compact-mobile','preview-report-sample'];
  var MOTION = { 'form-compact': 0, 'form-baseline': 1, 'form-question-first': 1, 'form-proof-led': 1,
                 'form-single-question': 2, 'form-progressive': 2 };

  var params = new URLSearchParams(location.search);
  var fv = params.get('fv');
  var pv = params.get('pv');
  if (FORMS.indexOf(fv) < 0) fv = null;
  if (PREVIEWS.indexOf(pv) < 0) pv = null;
  if (!fv && !pv) return;

  var root = document.documentElement;
  if (fv) root.setAttribute('data-cd-form', fv);
  if (pv) root.setAttribute('data-cd-preview', pv);
  root.setAttribute('data-cd-motion', String(MOTION[fv] == null ? 1 : MOTION[fv]));

  var isReport = params.get('auto') === '1' || params.get('report') === '1';

  function track(event, meta) {
    try { window.parent.postMessage({ type: 'cdVariantEvent', event: event, meta: meta || null }, '*'); } catch (e) {}
  }

  var LEAD = {
    'form-question-first': {
      title: '\u0427\u0442\u043e \u0441\u0435\u0439\u0447\u0430\u0441 \u0432\u0430\u0436\u043d\u0435\u0435 \u0432\u0441\u0435\u0433\u043e \u043f\u043e\u043d\u044f\u0442\u044c \u043e \u0441\u0435\u0431\u0435?',
      body: '\u0420\u0430\u0437\u0431\u043e\u0440 \u0441\u0442\u0440\u043e\u0438\u0442\u0441\u044f \u043f\u043e \u0434\u0430\u0442\u0435 \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u0438 \u0438\u043c\u0435\u043d\u0438. \u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u0441\u0440\u0430\u0437\u0443 \u043f\u043e\u0441\u043b\u0435 \u0440\u0430\u0441\u0447\u0451\u0442\u0430.'
    },
    'form-proof-led': {
      title: '\u041a\u0430\u043a \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0442\u0432\u043e\u0439 \u041a\u0440\u0438\u0441\u0442\u0430\u043b\u043b',
      list: ['\u0414\u0430\u0442\u0430 \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u0437\u0430\u0434\u0430\u0451\u0442 \u043e\u0441\u043d\u043e\u0432\u043d\u044b\u0435 \u0447\u0438\u0441\u043b\u0430 \u0441\u0443\u0434\u044c\u0431\u044b.',
             '\u0418\u043c\u044f \u0438 \u0444\u0430\u043c\u0438\u043b\u0438\u044f \u0434\u0430\u044e\u0442 \u0432\u0442\u043e\u0440\u0443\u044e \u043a\u0430\u0440\u0442\u0443 \u2014 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440 \u0438 \u043f\u0440\u043e\u044f\u0432\u043b\u0435\u043d\u0438\u0435.',
             '\u0421\u043e\u0432\u043f\u0430\u0434\u0435\u043d\u0438\u044f \u0438 \u0440\u0430\u0437\u043b\u0438\u0447\u0438\u044f \u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438 \u0444\u043e\u0440\u043c\u0438\u0440\u0443\u044e\u0442 \u0440\u0430\u0437\u0431\u043e\u0440.']
    }
  };

  function insertLead(card) {
    var spec = LEAD[fv];
    if (!spec) return;
    var box = document.createElement('div');
    box.className = 'cd-v-lead';
    var h = document.createElement('h3');
    h.textContent = spec.title;
    box.appendChild(h);
    if (spec.body) { var p = document.createElement('p'); p.textContent = spec.body; box.appendChild(p); }
    if (spec.list) {
      var ul = document.createElement('ul');
      spec.list.forEach(function (item) { var li = document.createElement('li'); li.textContent = item; ul.appendChild(li); });
      box.appendChild(ul);
    }
    var fields = card.querySelector('.form-grid');
    if (fields) card.insertBefore(box, fields);
    else card.insertBefore(box, card.firstChild);
  }

  function buildSteps(card, perStep) {
    var btn = document.getElementById('mainCalcBtn');
    if (!btn) return false;
    // Campurile stau in .form-grid; daca structura se schimba, coborim in primul container
    // care are cel putin doua blocuri cu campuri. Fara el, varianta cade pe formularul intreg.
    var host = card.querySelector('.form-grid');
    if (!host) {
      host = card;
      var single = null, found = 0;
      Array.prototype.forEach.call(card.children, function (child) {
        if (child.querySelector('input, select')) { found++; single = child; }
      });
      if (found === 1 && single) host = single;
    }
    var blocks = [];
    Array.prototype.forEach.call(host.children, function (child) {
      if (child.classList.contains('cd-v-lead')) return;
      if (child === btn || child.contains(btn)) return;
      // Doar campurile vizibile: alfabetul, promo si alte blocuri ascunse nu devin pasi goi.
      if (child.hidden || child.offsetParent === null) return;
      if (child.querySelector('input, select')) blocks.push(child);
    });
    if (blocks.length < 2) return false;
    host.classList.add('cd-v-stepped');

    var groups = [];
    for (var i = 0; i < blocks.length; i += perStep) groups.push(blocks.slice(i, i + perStep));
    if (groups.length < 2) return false;

    var progress = document.createElement('div');
    progress.className = 'cd-v-progress';
    var label = document.createElement('p');
    label.className = 'cd-v-progress-label';
    groups.forEach(function () { progress.appendChild(document.createElement('i')); });

    var steps = groups.map(function (group) {
      var step = document.createElement('div');
      step.className = 'cd-v-step';
      group.forEach(function (block) { step.appendChild(block); });
      return step;
    });

    steps.forEach(function (step) { host.appendChild(step); });
    host.insertBefore(label, steps[0]);
    host.insertBefore(progress, label);

    var nav = document.createElement('div');
    nav.className = 'cd-v-nav';
    var back = document.createElement('button');
    back.type = 'button'; back.className = 'cd-v-back';
    back.textContent = '\u041d\u0430\u0437\u0430\u0434';
    var next = document.createElement('button');
    next.type = 'button'; next.className = 'cd-v-next';
    next.textContent = '\u0414\u0430\u043b\u0435\u0435';
    nav.appendChild(back); nav.appendChild(next);
    host.appendChild(nav);

    var current = 0;
    function render() {
      steps.forEach(function (step, i) { step.hidden = i !== current; });
      Array.prototype.forEach.call(progress.children, function (dot, i) { dot.classList.toggle('is-on', i <= current); });
      label.textContent = '\u0428\u0430\u0433 ' + (current + 1) + ' \u0438\u0437 ' + steps.length;
      back.style.display = current === 0 ? 'none' : '';
      var last = current === steps.length - 1;
      nav.hidden = last;
      btn.style.display = last ? '' : 'none';
      var note = card.querySelector('.cd-main-cta-note');
      if (note) note.style.display = last ? '' : 'none';
      var focusable = steps[current].querySelector('input, select');
      if (focusable && current > 0) focusable.focus({ preventScroll: true });
    }
    function go(delta) {
      var target = current + delta;
      if (target < 0 || target >= steps.length) return;
      current = target;
      render();
      track('form_step_complete', { step: current });
      try { window.parent.postMessage({ type: 'resize', height: document.documentElement.scrollHeight }, '*'); } catch (e) {}
    }
    next.addEventListener('click', function () { go(1); });
    back.addEventListener('click', function () { go(-1); });
    card.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      if (nav.hidden) return;
      e.preventDefault();
      go(1);
    });
    render();
    return true;
  }

  function apply() {
    var card = document.getElementById('inputFormCard');
    if (!card || isReport) return;
    insertLead(card);
    if (fv === 'form-progressive') buildSteps(card, 2);
    else if (fv === 'form-single-question') buildSteps(card, 1);

    var interacted = false;
    card.addEventListener('input', function () {
      if (interacted) return;
      interacted = true;
      track('form_first_interaction');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();
})();
</script>

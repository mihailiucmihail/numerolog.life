<style id="cd-variants">
/* Strat contextual pentru preview-urile experimentale. Formularul public si varianta Control raman neschimbate. */
.cd-context-preview{display:flex;flex-direction:column;gap:16px}
.cd-context-head{padding:22px 20px;border:1px solid rgba(217,169,79,.26);border-radius:18px;background:rgba(16,10,31,.72)}
.cd-context-kicker{margin:0 0 8px;color:var(--brass-bright,#d9a94f);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.cd-context-head h2{margin:0;color:var(--parchment,#fff3d6);font-family:var(--font-display,serif);font-size:clamp(25px,5vw,38px);line-height:1.12}
.cd-context-meta{margin:8px 0 0;color:var(--parchment-dim,#c9bda3);font-size:13px}
.cd-context-answer{position:relative;padding:20px;border:1px solid rgba(217,169,79,.38);border-radius:18px;background:linear-gradient(145deg,rgba(217,169,79,.12),rgba(255,255,255,.035))}
.cd-context-label{display:inline-flex;margin-bottom:11px;padding:5px 8px;border-radius:999px;background:rgba(217,169,79,.13);color:var(--brass-bright,#d9a94f);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.cd-context-answer h3{margin:0 0 10px;color:var(--parchment,#fff3d6);font-family:var(--font-display,serif);font-size:21px;line-height:1.25}
.cd-context-answer p{margin:0;color:var(--parchment,#fff3d6);font-size:15px;line-height:1.65}
.cd-context-proof{margin-top:13px!important;padding-top:13px;border-top:1px solid rgba(255,255,255,.1);color:var(--parchment-dim,#c9bda3)!important;font-size:13.5px!important}
.cd-context-graph{padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(0,0,0,.16)}
.cd-context-graph h3{margin:0 0 4px;color:var(--parchment,#fff3d6);font-size:15px}
.cd-context-graph p{margin:0 0 8px;color:var(--parchment-dim,#c9bda3);font-size:13px;line-height:1.5}
.cd-context-next{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(0,0,0,.13)}
.cd-context-next h3{margin:0 0 12px;color:var(--parchment,#fff3d6);font-family:var(--font-display,serif);font-size:20px}
.cd-context-next ul{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.cd-context-next li{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.035);color:var(--parchment-dim,#c9bda3);font-size:13.5px;line-height:1.45}
.cd-context-next li:before{content:"";width:7px;height:7px;flex:0 0 7px;margin-top:6px;border:1px solid var(--brass-bright,#d9a94f);border-radius:50%}
.cd-context-lock{margin:12px 0 0;color:var(--brass-bright,#d9a94f);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:560px){.cd-context-head,.cd-context-answer{padding:17px 14px}.cd-context-preview{gap:12px}}
</style>
<script>
(function(){
  'use strict';
  var params = new URLSearchParams(location.search);
  var preview = params.get('pv') || 'preview-control';
  var allowed = ['preview-control','preview-birthday-first','preview-love-graph','preview-career-graph','preview-life-now','preview-content-first','preview-money-flow','preview-profession-match','preview-relationship-needs','preview-life-timeline'];
  if(allowed.indexOf(preview) < 0 || preview === 'preview-control' || preview === 'preview-birthday-first') return;
  document.documentElement.setAttribute('data-cd-preview', preview);
  document.documentElement.setAttribute('data-cd-form', params.get('fv') || 'form-control');

  var intent = params.get('intent') || '';
  var baseRenderPreview = window.renderPreview || renderPreview;

  var QUESTIONS = {
    'preview-love-graph': ['Почему в отношениях повторяется один сценарий?','Какой партнёр подходит тебе по внутренним потребностям?','Что чаще всего мешает близости?'],
    'preview-career-graph': ['В чём твоё сильное профессиональное направление?','Почему сейчас может ощущаться застой?','Что важно знать перед сменой работы?'],
    'preview-life-now': ['Что сейчас происходит в отношениях?','Что сейчас происходит в финансовой сфере?','Что сейчас происходит в карьере?','Что говорит твой текущий жизненный этап?'],
    'preview-money-flow': ['Что происходит с деньгами сейчас?','Есть ли впереди новый период финансового роста?','Где искать причину замедления финансового потока?'],
    'preview-profession-match': ['Какое профессиональное направление тебе подходит?','Какой тип роли использует твои сильные стороны?','Почему работа может не давать ощущения реализации?'],
    'preview-relationship-needs': ['Что создаёт для тебя чувство опоры в отношениях?','Что помогает тебе чувствовать близость и понимание?','Сколько свободы и движения тебе нужно в паре?'],
    'preview-life-timeline': ['Где ты находишься на линии жизни сейчас?','Что меняется на следующем отрезке?','Какая тема сильнее проявлена в текущем периоде?'],
    'preview-content-first': ['Что уже видно в твоём расчёте?']
  };
  var NEXT = {
    love: ['Как меняется личная линия по возрастам?','Какой повторяющийся сценарий требует внимания?','В какой период отношения входят в новую фазу?'],
    money: ['В каком возрасте меняется финансовая самостоятельность?','Где линия денег разворачивается вверх?','Какие качества усиливают или тормозят доход?'],
    career: ['Какие ещё сферы подходят тебе по расчёту?','Когда профессиональная линия входит в сильный период?','Что отличает призвание от просто подходящей работы?'],
    life: ['Какая сфера станет следующей активной темой?','Где находятся ключевые переходы твоей линии?','Как связаны текущий период и твои сильные качества?'],
    report: ['Какие качества помогают тебе сейчас?','Что показывает линия отношений, денег и реализации?','Где находятся ближайшие возрастные переходы?']
  };

  function indexFromIntent(){
    var match = intent.match(/:(\d+)$/);
    return match ? Math.max(0, Math.min(3, Number(match[1]))) : 0;
  }
  function questionFor(){
    var list = QUESTIONS[preview] || QUESTIONS['preview-content-first'];
    return list[indexFromIntent()] || list[0];
  }
  function careerAnswer(model){
    if(model.career && model.career.sphere){
      if(model.career.sphereFuture) return 'В твоём расчёте направление «' + model.career.sphere + '» раскрывается сильнее примерно к ' + model.career.sphereAge + ' годам.';
      return 'Среди рассчитанных направлений сильнее всего выделяется: ' + model.career.sphere + '.';
    }
    if(model.career && model.career.line) return model.career.line;
    return model.wow && model.wow[0] ? model.wow[0].text : 'Расчёт уже выделил профессиональную тему, связанную с твоими сильными качествами.';
  }
  function loveAnswer(model){
    return model.love && model.love.line ? model.love.line : (model.wow && model.wow[0] ? model.wow[0].text : 'Твой расчёт выделяет личную потребность, от которой зависит ощущение близости.');
  }
  function moneyAnswer(model){
    if(model.graph && model.graph.state) return model.graph.state;
    if(model.money && model.money.hasIndependenceAge) return 'На финансовой линии есть рассчитанный переход к большей самостоятельности.';
    return 'Финансовая линия развивается постепенно, без резкого перехода в рассчитанном диапазоне.';
  }
  function proofFor(model){
    if(preview.indexOf('love') >= 0 || preview.indexOf('relationship') >= 0) return model.love && model.love.hasFutureChange ? 'На личном графике есть будущая смена периода. Точный переход раскрывается в полном разборе.' : 'Ответ сопоставлен с твоей целью партнёрства и личной линией.';
    if(preview.indexOf('money') >= 0) return model.money && model.money.hasFutureUp ? 'На графике есть будущий разворот вверх. Его возраст и трактовка остаются в полном разборе.' : 'Вывод построен по текущему уровню и направлению финансовой линии.';
    if(preview.indexOf('career') >= 0 || preview.indexOf('profession') >= 0) return model.career && model.career.hasOtherSpheres ? 'Расчёт нашёл и другие подходящие сферы. Здесь показана только самая сильная.' : 'Вывод сопоставлен с самой сильной точкой графика реализации.';
    return model.graph ? 'Это положение рассчитано для твоего текущего возраста — ' + model.identity.age + '.' : 'Это один из персональных выводов полного расчёта.';
  }
  function topicFor(){
    if(preview.indexOf('love') >= 0 || preview.indexOf('relationship') >= 0) return 'love';
    if(preview.indexOf('money') >= 0) return 'money';
    if(preview.indexOf('career') >= 0 || preview.indexOf('profession') >= 0) return 'career';
    if(preview.indexOf('life') >= 0) return 'life';
    return 'report';
  }
  function answerFor(model){
    if(preview.indexOf('love') >= 0 || preview.indexOf('relationship') >= 0) return loveAnswer(model);
    if(preview.indexOf('money') >= 0) return moneyAnswer(model);
    if(preview.indexOf('career') >= 0 || preview.indexOf('profession') >= 0) return careerAnswer(model);
    if(preview === 'preview-life-now' || preview === 'preview-life-timeline') return model.graph && model.graph.state ? model.graph.state : (model.wow[0] && model.wow[0].text);
    return model.wow && model.wow[0] ? model.wow[0].text : loveAnswer(model);
  }
  function graphHtml(model){
    var g = model.graph;
    if(!g) return '';
    return '<section class="cd-context-graph"><h3>' + g.title + ' · сейчас</h3><p>Показан пройденный отрезок и твоя текущая точка. Будущее намеренно не раскрыто.</p>' + previewChartSvg(g) + '</section>';
  }
  function nextHtml(topic){
    return '<section class="cd-context-next"><h3>Этот ответ ведёт к следующим вопросам</h3><ul>' + NEXT[topic].map(function(q){ return '<li>' + q + '</li>'; }).join('') + '</ul><p class="cd-context-lock">Ответы продолжаются в полном разборе</p></section>';
  }

  window.renderPreview = renderPreview = function(model){
    baseRenderPreview(model);
    var layer = document.getElementById('previewLayer');
    if(!layer || model.birthday) return;
    var name = model.identity.name || 'Твой разбор';
    var graph = (preview === 'preview-content-first') ? '' : graphHtml(model);
    layer.innerHTML = '<div class="pv-screen cd-context-preview pv-reveal">' +
      '<header class="cd-context-head"><p class="cd-context-kicker">Ответ по твоему Кристаллу</p><h2>' + name + '</h2><p class="cd-context-meta">' + model.identity.date + ' · ' + model.identity.age + ' ' + yearsWord(model.identity.age) + '</p></header>' +
      '<section class="cd-context-answer"><span class="cd-context-label">Частичный ответ</span><h3>' + questionFor() + '</h3><p>' + answerFor(model) + '</p><p class="cd-context-proof">' + proofFor(model) + '</p></section>' +
      graph + nextHtml(topicFor()) + renderPaywall(model) + '</div>';
  };
})();
</script>

        '<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="#d9a94f" font-family="monospace">'+esc(m.label)+'</text>';
    });
    out += '<line x1="'+nowX+'" y1="'+padT+'" x2="'+nowX+'" y2="'+(H-padB)+'" stroke="#fff3d6" stroke-width="1.5" stroke-dasharray="2 3"/>'+
      '<circle cx="'+nowX+'" cy="'+ys(L.outside?L.avg:L.level)+'" r="5" fill="#fff3d6"/>'+
      '<text x="'+nowX+'" y="'+(padT-2)+'" text-anchor="middle" font-size="11" fill="#fff3d6" font-family="monospace">'+T.now+' · '+L.curAge+'</text>'+
      '<text x="'+padL+'" y="'+(H-8)+'" font-size="10" fill="#c9bda3" font-family="monospace">0</text></svg>';
    return out;
  }
  function head(kicker, model){
    return '<header class="cd-tp-head"><p class="cd-tp-kicker">'+kicker+'</p><h2>'+esc(model.identity.name||model.identity.first||'')+'</h2><p class="cd-tp-meta">'+esc(model.identity.date)+' · '+esc(model.identity.age)+' '+T.years+'</p></header>';
  }
  function lockedBlock(title, items){
    return '<section class="cd-tp-locked"><h3>'+title+'</h3><ul>'+items.map(function(it){ return '<li><i></i><span><b>'+esc(it[0])+'</b> — '+esc(it[1])+'</span></li>'; }).join('')+'</ul></section>';
  }
  function renderLove(model){
    var C = T.love, L = lineData('personal');
    if(!L) return null;
    var html = head(C.kicker, model);
    var lastAge = Math.round(L.last);
    if(L.outside){
      html += '<section class="cd-tp-card"><h3>'+C.nowTitle+'</h3><p>'+esc(C.outside(lastAge))+'</p></section>';
    } else {
      var lastPast = L.past[L.past.length-1];
      html += '<section class="cd-tp-card"><span class="cd-tp-phase">'+esc(phaseLabel(L.d,L.rising))+'</span><h3>'+C.nowTitle+'</h3><p>'+esc(C.state(L.d,L.rising))+' '+esc(lastPast?C.since(Math.round(lastPast.age), yearOf(lastPast.age)):C.sinceStart)+'</p></section>';
      var nx = L.future[0];
      if(nx){
        var age = Math.round(nx.age), diff = Math.max(0, Math.round(nx.age - L.curAge));
        html += '<section class="cd-tp-hero"><p class="cd-tp-label">'+C.nextTitle+'</p><div class="cd-tp-big"><strong>'+age+'</strong><span>'+yearsWordL(age)+'</span><em>'+yearOf(nx.age)+' · '+esc(T.inYears(diff))+'</em></div><p>'+esc(C.nextLead)+'. '+esc(C.nextDir(nx.up))+'</p></section>';
        html += '<section class="cd-tp-graph"><h3>'+C.graph+'</h3><p>'+C.graphNote+'</p>'+svg(L,[{age:nx.age,label:String(age)}])+'</section>';
      } else {
        html += '<section class="cd-tp-hero"><p class="cd-tp-label">'+C.nextTitle+'</p><p>'+esc(C.nextNone(lastAge))+'</p></section>';
        html += '<section class="cd-tp-graph"><h3>'+C.graph+'</h3><p>'+C.graphNote+'</p>'+svg(L,[])+'</section>';
      }
    }
    if(model.love && model.love.line) html += '<section class="cd-tp-card"><h3>'+C.needTitle+'</h3><p>'+esc(model.love.line)+'</p></section>';
    var remaining = Math.max(0, L.future.length-1);
    html += lockedBlock(C.lockedTitle, C.locked(remaining, lastAge));
    return html;
  }
  function renderMoney(model){
    var C = T.money, L = lineData('financial');
    if(!L) return null;
    var html = head(C.kicker, model);
    var lastAge = Math.round(L.last);
    var cross = L.points && crossingsWithDirection(L.points, L.avg) || [];
    var ind = cross[0] || null;
    var early = ind && ind.age < 14;
    if(ind){
      var age = Math.round(ind.age), yr = yearOf(ind.age), passed = ind.age <= L.curAge, n = Math.abs(Math.round(ind.age - L.curAge));
      html += '<section class="cd-tp-hero"><p class="cd-tp-label">'+C.heroLabel+'</p><div class="cd-tp-big"><strong>'+age+'</strong><span>'+yearsWordL(age)+'</span><em>'+yr+'</em></div><p>'+esc(early?C.early(age,yr):passed?C.past(age,yr,n):C.future(age,yr,n))+'</p><p class="cd-tp-sub">'+C.heroSub+'</p></section>';
    } else {
      html += '<section class="cd-tp-hero"><p class="cd-tp-label">'+C.heroLabel+'</p><p>'+esc(C.none)+'</p><p class="cd-tp-sub">'+C.heroSub+'</p></section>';
    }
    if(L.outside){
      html += '<section class="cd-tp-card"><h3>'+C.nowTitle+'</h3><p>'+esc(C.outside(lastAge))+'</p></section>';
    } else {
      html += '<section class="cd-tp-card"><span class="cd-tp-phase">'+esc(phaseLabel(L.d,L.rising))+'</span><h3>'+C.nowTitle+'</h3><p>'+esc(C.state(L.d,L.rising))+'</p></section>';
    }
    html += '<section class="cd-tp-graph"><h3>'+C.graph+'</h3><p>'+C.graphNote+'</p>'+svg(L, ind ? [{age:ind.age,label:String(Math.round(ind.age))}] : [])+'</section>';
    var peakFuture = L.peak && L.peak.plotAge > L.curAge + 1;
    html += lockedBlock(C.lockedTitle, C.locked(peakFuture, lastAge, L.future.length));
    return html;
  }
  window.renderPreview = renderPreview = function(model){
    baseRender(model);
    var layer = document.getElementById('previewLayer');
    if(!layer || model.birthday) return;
    var body = pv === 'preview-love-line-v1' ? renderLove(model) : renderMoney(model);
    if(!body) return;
    layer.innerHTML = '<div class="pv-screen cd-tp pv-reveal">'+body+renderPaywall(model)+'</div>';
  };
})();
</script>
